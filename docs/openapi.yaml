# ============================================================================
# Components & Schemas
# ============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Key
      description: Kunci API klien Route-X format `sk_live_<random>`.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Kunci API klien Route-X format `sk_live_<random>` via header `x-api-key` (standar Anthropic SDK).
    MetricsBearer:
      type: http
      scheme: bearer
      description: Token scraper metrik (env METRICS_TOKEN) untuk /metrics tanpa sesi admin.
    SessionCookie:
      type: apiKey
      in: cookie
      name: routex_session
      description: Cookie sesi login konsol administratif.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token proteksi CSRF double-submit token.

  schemas:
    AnthropicMessageRequest:
      type: object
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
          description: ID model kanonik Anthropic Claude (misal claude-3-7-sonnet-20250219)
          example: claude-3-7-sonnet-20250219
        messages:
          type: array
          description: Daftar pesan percakapan berurutan (user / assistant)
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                description: Teks prompt atau array blok konten (teks, image, tool_result)
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
        max_tokens:
          type: integer
          description: Jumlah token maksimum yang diizinkan untuk dihasilkan
          example: 4096
        system:
          type: string
          description: Instruksi prompt sistem terpisah untuk model Claude
          example: Anda adalah asisten rekayasa perangkat lunak Route-X.
        stream:
          type: boolean
          default: false
          description: Aktifkan streaming Server-Sent Events (SSE) protokol Anthropic
        temperature:
          type: number
          nullable: true
          example: 0.7
        tools:
          type: array
          description: Definisi perkakas (function/tool calling)
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              input_schema:
                type: object

    AnthropicMessageResponse:
      type: object
      required:
        - id
        - type
        - role
        - model
        - content
        - usage
      properties:
        id:
          type: string
          example: msg_01ABC123XYZ456
        type:
          type: string
          example: message
        role:
          type: string
          example: assistant
        model:
          type: string
          example: claude-3-7-sonnet-20250219
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: text
              text:
                type: string
                example: Halo! Ada yang bisa saya bantu terkait Route-X?
        stop_reason:
          type: string
          nullable: true
          example: end_turn
        stop_sequence:
          type: string
          nullable: true
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
              example: 42
            output_tokens:
              type: integer
              example: 128

    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: ID model kanonik atau alias yang diminta
          example: gpt-4o
        messages:
          type: array
          description: Urutan pesan dialog percakapan
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          minimum: 0.0
          maximum: 2.0
          example: 0.7
          description: Bila tidak diisi, gateway TIDAK menetapkan nilai bawaan — parameter dibiarkan ke bawaan model di upstream.
        top_p:
          type: number
          minimum: 0.0
          maximum: 1.0
        max_tokens:
          type: integer
          description: Batas maksimal token keluaran yang dihasilkan
          example: 1024
        stream:
          type: boolean
          default: false
          description: Aktifkan streaming potongan teks via Server-Sent Events (SSE)
        stop:
          description: Urutan penghenti — satu string atau array string
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        tools:
          type: array
          description: Definisi perkakas (function calling) yang diteruskan ke upstream
          items:
            type: object
        tool_choice:
          description: Pilihan pemakaian perkakas (string seperti "auto"/"none" atau objek penunjuk fungsi)
          oneOf:
            - type: string
            - type: object
        response_format:
          type: object
          description: 'Format respons yang diminta (mis. {type: json_object})'
        seed:
          type: integer
        reasoning_effort:
          type: string
        user:
          type: string
          description: Pengenal pengguna akhir pemanggil, diteruskan ke upstream

    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          example: user
        content:
          description: Isi pesan — teks polos atau array bagian konten multimodal (teks, gambar, dan sebagainya)
          oneOf:
            - type: string
              example: Jelaskan arsitektur routing pada Route-X AI Gateway.
            - type: array
              items:
                type: object
        name:
          type: string
          example: Ahmad

    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
      properties:
        id:
          type: string
          example: chatcmpl-8k123abc456
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          example: 1725380000
        model:
          type: string
          example: gpt-4o
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                example: 0
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
                example: stop
        usage:
          $ref: '#/components/schemas/UsageInfo'

    EmbeddingRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          example: text-embedding-3-small
        input:
          description: |
            Teks yang akan di-embedding: satu string, array string, atau array
            token yang sudah dikodekan (satu array bilangan, atau array dari
            array bilangan untuk batch). Bentuk token diteruskan apa adanya ke
            provider berdialek OpenAI dan ditolak oleh provider dialek lain
            (mis. Google) yang hanya menerima teks.
          oneOf:
            - type: string
              example: Dokumen kebijakan privasi dan keamanan sistem.
            - type: array
              items:
                type: string
            - type: array
              items:
                type: integer
            - type: array
              items:
                type: array
                items:
                  type: integer

    EmbeddingResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                example: embedding
              index:
                type: integer
                example: 0
              embedding:
                type: array
                items:
                  type: number
        model:
          type: string
          example: text-embedding-3-small
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
              example: 8
            total_tokens:
              type: integer
              example: 8

    ModelObject:
      type: object
      properties:
        id:
          type: string
          example: gpt-4o
        object:
          type: string
          example: model
        created:
          type: integer
          example: 1700000000
        owned_by:
          type: string
          example: openai

    ModelListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelObject'
        first_id:
          type: string
          nullable: true
          description: Id entri pertama pada halaman ini (null bila kosong)
        last_id:
          type: string
          nullable: true
          description: Id entri terakhir pada halaman ini (null bila kosong)
        has_more:
          type: boolean
          description: Masih ada entri sesudah halaman ini

    UsageInfo:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          example: 125
        completion_tokens:
          type: integer
          example: 450
        total_tokens:
          type: integer
          example: 575

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
            - code
          properties:
            message:
              type: string
              example: Kunci API tidak sah atau tidak ditemukan.
            type:
              type: string
              example: authentication_error
            code:
              type: string
              example: invalid_api_key
            param:
              type: string
              nullable: true
            request_id:
              type: string
              example: 3b15169b-ad67-43f1-87f7-5cbcfa88c759

    AddModelAliasRequest:
      type: object
      properties:
        alias:
          type: string
    AddProviderModelRequest:
      type: object
      properties:
        name:
          type: string
    AttachProviderRequest:
      type: object
      properties:
        provider_id:
          type: string
        upstream_model:
          type: string
        priority:
          type: integer
          nullable: true
        weight:
          type: integer
          nullable: true
        timeout_ms:
          type: integer
          nullable: true
        enabled:
          type: boolean
          nullable: true
    AuditEntryDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        occurred_at:
          type: string
          format: date-time
        actor_user_id:
          type: string
        actor_email:
          type: string
        actor_role:
          type: string
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        request_id:
          type: string
        metadata:
          description: "Nilai JSON bebas (sesuai struktur yang disimpan)"
      required: [id, occurred_at, action, resource_type, metadata]
    AuditEntryListEnvelope:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntryDTO"
        next_cursor:
          type: string
          nullable: true
          description: "Kursor halaman berikutnya; kosong/null bila tidak ada lagi"
      required: [items]
    BackupRestoreResponse:
      type: object
      properties:
        status:
          type: string
        safety_database:
          type: string
        schema_version:
          type: integer
          format: int64
      required: [status, safety_database, schema_version]
    BackupStatusDTO:
      type: object
      properties:
        database_name:
          type: string
        database_size:
          type: string
        database_bytes:
          type: integer
          format: int64
        total_tables:
          type: integer
        models_count:
          type: integer
        providers_count:
          type: integer
        routing_rules_count:
          type: integer
        api_keys_count:
          type: integer
        last_server_backup:
          allOf:
            - $ref: "#/components/schemas/ServerBackupInfo"
          nullable: true
      required: [database_name, database_size, database_bytes, total_tables, models_count, providers_count, routing_rules_count, api_keys_count]
    BanDTO:
      type: object
      properties:
        id:
          type: string
        subject_kind:
          type: string
        subject:
          type: string
        reason:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        lifted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, subject_kind, subject, reason, created_at]
    BanListEnvelope:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BanDTO"
        next_cursor:
          type: string
          nullable: true
          description: "Kursor halaman berikutnya; kosong/null bila tidak ada lagi"
