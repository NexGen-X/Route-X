services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: routex-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-routex}:${POSTGRES_PASSWORD:-routex_secret_pass}@postgres:5432/${POSTGRES_DB:-routex}?sslmode=${DB_SSLMODE:-disable}
      - REDIS_URL=redis://redis:6379/0
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_KEY_PEPPER=${API_KEY_PEPPER}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@route-x.local}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - UPSTREAM_TIMEOUT=${UPSTREAM_TIMEOUT:-120s}
      - SHUTDOWN_GRACE=${SHUTDOWN_GRACE:-25s}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - routex_internal

  postgres:
    image: postgres:16-alpine
    container_name: routex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-routex_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-routex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-routex} -d ${POSTGRES_DB:-routex}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - routex_internal

  redis:
    image: redis:7-alpine
    container_name: routex-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - routex_internal

  caddy:
    image: caddy:2-alpine
    container_name: routex-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - routex_internal

volumes:
  pgdata:
    name: routex_pgdata
  redisdata:
    name: routex_redisdata
  caddy_data:
    name: routex_caddy_data
  caddy_config:
    name: routex_caddy_config

networks:
  routex_internal:
    name: routex_internal
    driver: bridge
