# Dependabot (audit F10): pembaruan dependensi terjadwal agar CVE pada
# rantai pasok tidak menunggu audit manual. Semua pembaruan masuk sebagai
# PR dan mengikuti aturan repo: pantau CI sampai hijau lalu gabung.
#
# Kebijakan pengelompokan & abaikan (3 Nov 2026): update minor + patch
# digabung menjadi satu PR grup per ekosistem agar antrean mingguan tidak
# menumpuk sebagai banyak PR satuan. Bump MAJOR untuk dependensi yang
# dipin sadar (react, react-dom, @types/react, @types/react-dom, vite,
# lucide-react pada npm; node pada docker) DIABAIKAN: kenaikan major
# adalah pekerjaan upgrade terencana yang diuji tersendiri, bukan banjir
# PR mingguan. Buktinya 2 Nov 2026: lima PR major dependabot menumpuk
# sekaligus, dan sebagian (pasangan react/react-dom serta vite) terbukti
# tidak bisa diinstal sendirian karena konflik peer antar-dependensi.
# Ekosistem gomod & github-actions TIDAK diabaikan major-nya: pengecualian
# berdiri pemilik membiarkan upgrade versi demi CVE lewat pola PR + CI.
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Citra dasar Dockerfile (node/golang/alpine) ikut terpantau.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    groups:
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
