openapi: 3.1.0
info:
  title: Route-X AI Gateway API
  description: |
    Spesifikasi resmi antarmuka Route-X AI Gateway — gateway inferensi LLM berperforma tinggi dengan
    enkripsi kredensial AES-256-GCM, perutean adaptif ber-failover otomatis, pemutus arus terdistribusi,
    pengawasan anggaran berpresisi finansial skala 8 desimal (upstream.USD), jejak audit menyeluruh,
    dan dashboard operasional tersemat.

    Catatan cakupan: permukaan /v1 dan /api/auth terdokumentasi penuh. Permukaan
    /api/admin memiliki 135 operasi terdaftar; yang terdokumentasi di sini adalah
    operasi inti yang paling sering dipakai alat eksternal — sisanya (users,
    sessions, webhooks, settings, backup, egress, rate-limits, dan seluruh
    PUT/DELETE/toggle) mengikuti pola envelope dan autentikasi yang sama tetapi
    belum diuraikan satu per satu dalam dokumen ini.
  version: 1.5.1
  contact:
    name: Route-X Engineering Team
    email: admin@routex.internal
  license:
    name: Hak Cipta Dilindungi

servers:
  - url: /
    description: Instance Gateway Lokal / Produksi

paths:
  # ============================================================================
  # 1. Inferencing Endpoints (/v1)
  # ============================================================================
  /v1/chat/completions:
    post:
      tags:
        - Inferencing
      summary: Eksekusi Chat Completions
      description: |
        Mengirimkan percakapan chat ke upstream provider model terbaik sesuai strategi perutean.
        Mendukung streaming respon SSE (Server-Sent Events), function/tool calling, pencatatan latensi TTFT,
        dan kalkulasi pemakaian token serta biaya moneter secara instan.
      operationId: createChatCompletion
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Berhasil memproses permintaan chat (atau stream text/event-stream)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: Aliran SSE token teks per potongan
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '402':
          $ref: '#/components/responses/402BudgetExceeded'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429RateLimited'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'

  /v1/messages:
    post:
      tags:
        - Inferencing
      summary: Eksekusi Native Anthropic Messages API
      description: |
        Protokol asli Anthropic Claude Messages API (Claude Code, Cursor, Cline, LibreChat).
        Mendukung SSE streaming, multimodal images, tool/function calling.
        Prefiks ganda /v1/v1/messages juga dilayani sebagai alias toleransi untuk
        klien yang menyusun base URL berlapis; bentuk kanoniknya adalah /v1/messages.
        Pendamping POST /v1/messages/count_tokens menerima body yang sama dan
        mengembalikan taksiran jumlah token masukan.
      operationId: createAnthropicMessage
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: Berhasil memproses pesan Anthropic (atau stream text/event-stream)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessageResponse'
            text/event-stream:
              schema:
                type: string
                description: Aliran SSE Anthropic content_block_delta dan message_delta
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /v1/responses:
    post:
      tags:
        - Inferencing
      summary: Eksekusi Chat Completions (alias nama /responses)
      description: |
        Nama baru OpenAI untuk permukaan percakapan yang sama, dilayani handler
        Chat Completions. PERHATIAN: bentuk asli OpenAI Responses API
        (`{model, input}` dan respons ber-`object: response`) BELUM didukung —
        body wajib mengikuti skema Chat Completions (`messages`) dan responsnya
        berbentuk `chat.completion`. Klien yang mengirim bentuk Responses API
        asli menerima 400 karena `messages` kosong.
      operationId: createResponse
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Berhasil memproses permintaan (bentuk chat.completion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '402':
          $ref: '#/components/responses/402BudgetExceeded'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429RateLimited'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'

  /v1/embeddings:
    post:
      tags:
        - Inferencing
      summary: Buat Representasi Vektor (Embeddings)
      description: Menghasilkan representasi vektor teks untuk pencarian semantik dan basis pengetahuan RAG.
      operationId: createEmbedding
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Vektor embeddings berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '402':
          $ref: '#/components/responses/402BudgetExceeded'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429RateLimited'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'

  /v1/models:
    get:
      tags:
        - Inferencing
      summary: Daftar Model Tersedia
      description: |
        Mengembalikan katalog model kanonik dan alias yang aktif di Route-X Gateway.
        Hanya model yang benar-benar bisa dilayani key pemanggil yang tampil: model
        tanpa pemetaan provider, model yang dimatikan, dan model yang seluruh
        providernya terlarang bagi key tidak didaftarkan. Alias tampil sebagai entri
        sendiri. Endpoint ini bacaan katalog dan TIDAK memakan kuota laju inferensi.
      operationId: listModels
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Jumlah maksimum entri pada halaman ini. Tanpa parameter ini seluruh katalog dikembalikan.
          schema:
            type: integer
            minimum: 1
        - name: after_id
          in: query
          required: false
          description: Kursor paginasi — id entri terakhir dari halaman sebelumnya; halaman berikutnya mulai tepat sesudahnya.
          schema:
            type: string
      responses:
        '200':
          description: Daftar model berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /v1/models/{model}:
    get:
      tags:
        - Inferencing
      summary: Detail Satu Model
      description: |
        Mengembalikan satu entri model menurut nama kanonik atau aliasnya. Model
        yang tidak tampil di daftar (dimatikan, tanpa pemetaan, atau terlarang
        bagi key pemanggil) dijawab 404 yang sama seperti model yang tidak ada.
      operationId: getModel
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: model
          in: path
          required: true
          description: Nama kanonik atau alias model
          schema:
            type: string
      responses:
        '200':
          description: Detail model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelObject'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ============================================================================
  # 2. Health & Observability Endpoints
  # ============================================================================
  /healthz:
    get:
      tags:
        - Health & Telemetry
      summary: Liveness Probe
      description: Memastikan biner gateway hidup dan dapat menerima lalu lintas HTTP.
      operationId: livenessProbe
      security: []
      responses:
        '200':
          description: Gateway dalam keadaan aktif
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: v1.0.0
                  commit:
                    type: string
                    example: a1b2c3d
                  uptime_seconds:
                    type: integer
                    example: 3600

    head:
      tags:
        - Health & Telemetry
      summary: Liveness Probe (HEAD)
      description: Bentuk HEAD dari liveness probe, untuk load balancer yang hanya memeriksa status.
      operationId: livenessProbeHead
      security: []
      responses:
        '200':
          description: Gateway dalam keadaan aktif

  /readyz:
    get:
      tags:
        - Health & Telemetry
      summary: Readiness Probe
      description: Memeriksa kesiapan dependensi kritis (PostgreSQL connection pool dan Redis client).
      operationId: readinessProbe
      security: []
      responses:
        '200':
          description: Seluruh dependensi sehat dan siap melayani permintaan
        '503':
          description: Salah satu dependensi gagal atau terputus
    head:
      tags:
        - Health & Telemetry
      summary: Readiness Probe (HEAD)
      description: Bentuk HEAD dari readiness probe.
      operationId: readinessProbeHead
      security: []
      responses:
        '200':
          description: Seluruh dependensi sehat dan siap melayani permintaan
        '503':
          description: Salah satu dependensi gagal atau terputus

  /metrics:
    get:
      tags:
        - Health & Telemetry
      summary: Prometheus Telemetry Metrics
      description: |
        Menyajikan eksposur metrik internal format teks Prometheus untuk scraping Prometheus/Grafana.
        Akses diberikan lewat salah satu dari: sesi admin, header
        `Authorization: Bearer <METRICS_TOKEN>`, atau koneksi loopback bila
        METRICS_ALLOW_LOOPBACK dinyalakan operator (bawaan mati di produksi).
      operationId: getPrometheusMetrics
      security:
        - SessionCookie: []
        - MetricsBearer: []
      responses:
        '200':
          description: Data metrik Prometheus
          content:
            text/plain:
              schema:
                type: string

  # ============================================================================
  # 3. Authentication & Session Management (/api/auth)
  # ============================================================================
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Masuk Sesi Konsol Admin
      description: Memvalidasi kredensial email dan kata sandi menggunakan hashing Argon2id dan menetapkan cookie sesi.
      operationId: loginAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@routex.internal
                password:
                  type: string
                  format: password
                  example: Passw0rdRahasia!
      responses:
        '200':
          description: Login berhasil, cookie routex_session dan routex_csrf terpasang
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429RateLimited'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Keluar Sesi Konsol
      description: Menghapus token sesi dari database dan mencabut cookie sesi aktif.
      operationId: logoutAdmin
      security:
        - SessionCookie: []
          CSRFToken: []
      responses:
        '200':
          description: Sesi berhasil ditutup

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Informasi Pengguna & Hak Akses Sesi
      description: Mengambil data pengguna login saat ini beserta token CSRF sesi. Route-X memakai model admin tunggal — setiap pengguna terautentikasi adalah admin penuh; tidak ada peran RBAC.
      operationId: getPrincipalMe
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Informasi identitas berhasil dimuat

  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Perbarui Kata Sandi Pengguna
      description: Mengubah kata sandi pengguna aktif dan mencabut sesi aktif lainnya.
      operationId: changePassword
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Kata sandi berhasil diperbarui

  /api/auth/setup-hint:
    get:
      tags:
        - Authentication
      summary: Petunjuk Status Onboarding Awal
      description: |
        Endpoint publik yang menyatakan apakah instalasi masih pada keadaan
        awal (admin bawaan belum mengganti kata sandinya). Nonaktif secara
        informasi begitu onboarding selesai.
      operationId: getSetupHint
      security: []
      responses:
        '200':
          description: Status onboarding berhasil dimuat

  /api/internal/tls-check:
    get:
      tags:
        - Health & Telemetry
      summary: Pemeriksaan Domain & TLS untuk Caddy
      description: |
        Dipakai reverse proxy (Caddy on-demand TLS) untuk memutuskan apakah
        sebuah nama host boleh diterbitkan sertifikatnya. Menjawab 200 untuk
        domain yang terdaftar pada instalasi ini dan 400 untuk yang tidak.
      operationId: caddyTLSCheck
      security: []
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Domain terdaftar; sertifikat boleh diterbitkan
        '400':
          description: Domain tidak terdaftar pada instalasi ini

  # ============================================================================
  # 4. Administrative REST API (/api/admin/*)
  # ============================================================================
  /api/admin/observability/summary:
    get:
      tags:
        - Admin Observability
      summary: Ringkasan Metrik Operasional
      description: Agregasi volume request, token in/out, total biaya USD, latensi rata-rata, p95, dan rasio error.
      operationId: getAdminSummary
      security:
        - SessionCookie: []
      parameters:
        - name: window
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d]
            default: 24h
      responses:
        '200':
          description: Ringkasan metrik berhasil dimuat

  /api/admin/requests:
    get:
      tags:
        - Admin Requests
      summary: Log Permintaan Inferensi (Keyset Pagination)
      description: Menelusuri rekaman request log dengan pencarian teks, filter provider, status, dan sorting.
      operationId: listAdminRequests
      security:
        - SessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
        - name: status_class
          in: query
          schema:
            type: string
            enum: [2xx, 4xx, 5xx, error]
      responses:
        '200':
          description: Halaman request log berhasil dimuat

  /api/admin/upstreams/providers:
    get:
      tags:
        - Admin Upstreams
      summary: Daftar Upstream Providers
      description: Mengambil seluruh upstream provider LLM beserta status kesehatan dan bobot alokasi.
      operationId: listProviders
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Daftar provider berhasil diambil
    post:
      tags:
        - Admin Upstreams
      summary: Buat Upstream Provider Baru
      description: |
        Mendaftarkan provider AI hulu baru. Saat pendaftaran, base_url hanya
        diperiksa skemanya (wajib diawali http:// atau https://, ditegakkan
        constraint database); penegakan SSRF penuh atas alamat tujuan —
        resolusi DNS, alamat privat, kredensial di dalam URL, dan pengalihan —
        ditegakkan kemudian, saat koneksi keluar dibuat oleh dialer
        berpenjaga, bukan saat pendaftaran.
      operationId: createProvider
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, base_url]
              properties:
                name:
                  type: string
                  description: Pengenal unik provider (huruf kecil, angka, tanda hubung)
                display_name:
                  type: string
                kind:
                  type: string
                  enum: [openai, anthropic, google, openai_compatible, custom]
                base_url:
                  type: string
                  format: uri
                enabled:
                  type: boolean
                priority:
                  type: integer
                weight:
                  type: integer
                timeout_ms:
                  type: integer
                max_retries:
                  type: integer
                rate_limit_rpm:
                  type: integer
                rate_limit_tpm:
                  type: integer
                max_concurrent:
                  type: integer
                egress_pool_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Provider berhasil dibuat
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'

  /api/admin/upstreams/providers/{id}/probe:
    post:
      tags:
        - Admin Upstreams
      summary: Diagnostic Health Probe
      description: Melakukan pemeriksaan kesehatan langsung ke endpoint upstream provider melalui adapter nyata.
      operationId: probeProvider
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Hasil pemeriksaan probe kesehatan

  /api/admin/gateway/routing-rules:
    get:
      tags:
        - Admin Gateway
      summary: Daftar Aturan Perutean (Routing Rules)
      operationId: listRoutingRules
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Aturan routing berhasil dimuat

  /api/admin/gateway/budgets:
    get:
      tags:
        - Admin Gateway
      summary: Alokasi Anggaran Biaya Moneter
      operationId: listBudgets
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Daftar alokasi anggaran biaya USD

  /api/admin/access/api-keys:
    get:
      tags:
        - Admin Access
      summary: Daftar Kunci API Klien
      operationId: listAPIKeys
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Kunci API tersamar berhasil dimuat
    post:
      tags:
        - Admin Access
      summary: Buat Kunci API Klien Baru
      description: Menghasilkan token API key baru (format sk_live_...) dan mengembalikan kunci plaintext sekali tampil.
      operationId: createAPIKey
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                label:
                  type: string
                live:
                  type: boolean
                  description: true untuk kunci produksi (sk_live_...), false untuk kunci uji (sk_test_...)
                scopes:
                  type: array
                  items:
                    type: string
                rate_limit_rpm:
                  type: integer
                rate_limit_tpm:
                  type: integer
                daily_request_limit:
                  type: integer
                  format: int64
                monthly_request_limit:
                  type: integer
                  format: int64
                daily_token_limit:
                  type: integer
                  format: int64
                monthly_token_limit:
                  type: integer
                  format: int64
                ip_allowlist:
                  type: array
                  items:
                    type: string
                expires_at:
                  type: string
                  format: date-time
                allowed_models:
                  type: array
                  items:
                    type: string
                  description: Pembatasan model yang boleh dipakai kunci ini
                allowed_providers:
                  type: array
                  items:
                    type: string
                  description: Pembatasan provider yang boleh dipakai kunci ini
      responses:
        '201':
          description: Kunci API berhasil dibuat
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'

  /api/admin/system/diagnostics:
    get:
      tags:
        - Admin System
      summary: Diagnostik Server & Koneksi Pool
      description: Informasi runtime memori Go, versi kompilator, uptime, dan statistik koneksi pgxpool.
      operationId: getDiagnostics
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Status diagnostik sistem berhasil diambil

# ============================================================================
# Components & Schemas
# ============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Key
      description: Kunci API klien Route-X format `sk_live_<random>`.
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Kunci API klien Route-X format `sk_live_<random>` via header `x-api-key` (standar Anthropic SDK).
    MetricsBearer:
      type: http
      scheme: bearer
      description: Token scraper metrik (env METRICS_TOKEN) untuk /metrics tanpa sesi admin.
    SessionCookie:
      type: apiKey
      in: cookie
      name: routex_session
      description: Cookie sesi login konsol administratif.
    CSRFToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Token proteksi CSRF double-submit token.

  schemas:
    AnthropicMessageRequest:
      type: object
      required:
        - model
        - messages
        - max_tokens
      properties:
        model:
          type: string
          description: ID model kanonik Anthropic Claude (misal claude-3-7-sonnet-20250219)
          example: claude-3-7-sonnet-20250219
        messages:
          type: array
          description: Daftar pesan percakapan berurutan (user / assistant)
          items:
            type: object
            required:
              - role
              - content
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                description: Teks prompt atau array blok konten (teks, image, tool_result)
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: object
        max_tokens:
          type: integer
          description: Jumlah token maksimum yang diizinkan untuk dihasilkan
          example: 4096
        system:
          type: string
          description: Instruksi prompt sistem terpisah untuk model Claude
          example: Anda adalah asisten rekayasa perangkat lunak Route-X.
        stream:
          type: boolean
          default: false
          description: Aktifkan streaming Server-Sent Events (SSE) protokol Anthropic
        temperature:
          type: number
          nullable: true
          example: 0.7
        tools:
          type: array
          description: Definisi perkakas (function/tool calling)
          items:
            type: object
            properties:
              name:
                type: string
              description:
                type: string
              input_schema:
                type: object

    AnthropicMessageResponse:
      type: object
      required:
        - id
        - type
        - role
        - model
        - content
        - usage
      properties:
        id:
          type: string
          example: msg_01ABC123XYZ456
        type:
          type: string
          example: message
        role:
          type: string
          example: assistant
        model:
          type: string
          example: claude-3-7-sonnet-20250219
        content:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: text
              text:
                type: string
                example: Halo! Ada yang bisa saya bantu terkait Route-X?
        stop_reason:
          type: string
          nullable: true
          example: end_turn
        stop_sequence:
          type: string
          nullable: true
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
              example: 42
            output_tokens:
              type: integer
              example: 128

    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: ID model kanonik atau alias yang diminta
          example: gpt-4o
        messages:
          type: array
          description: Urutan pesan dialog percakapan
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          minimum: 0.0
          maximum: 2.0
          example: 0.7
          description: Bila tidak diisi, gateway TIDAK menetapkan nilai bawaan — parameter dibiarkan ke bawaan model di upstream.
        top_p:
          type: number
          minimum: 0.0
          maximum: 1.0
        max_tokens:
          type: integer
          description: Batas maksimal token keluaran yang dihasilkan
          example: 1024
        stream:
          type: boolean
          default: false
          description: Aktifkan streaming potongan teks via Server-Sent Events (SSE)
        stop:
          description: Urutan penghenti — satu string atau array string
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        tools:
          type: array
          description: Definisi perkakas (function calling) yang diteruskan ke upstream
          items:
            type: object
        tool_choice:
          description: Pilihan pemakaian perkakas (string seperti "auto"/"none" atau objek penunjuk fungsi)
          oneOf:
            - type: string
            - type: object
        response_format:
          type: object
          description: 'Format respons yang diminta (mis. {type: json_object})'
        seed:
          type: integer
        reasoning_effort:
          type: string
        user:
          type: string
          description: Pengenal pengguna akhir pemanggil, diteruskan ke upstream

    ChatMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          example: user
        content:
          description: Isi pesan — teks polos atau array bagian konten multimodal (teks, gambar, dan sebagainya)
          oneOf:
            - type: string
              example: Jelaskan arsitektur routing pada Route-X AI Gateway.
            - type: array
              items:
                type: object
        name:
          type: string
          example: Ahmad

    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
      properties:
        id:
          type: string
          example: chatcmpl-8k123abc456
        object:
          type: string
          example: chat.completion
        created:
          type: integer
          example: 1725380000
        model:
          type: string
          example: gpt-4o
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
                example: 0
              message:
                $ref: '#/components/schemas/ChatMessage'
              finish_reason:
                type: string
                example: stop
        usage:
          $ref: '#/components/schemas/UsageInfo'

    EmbeddingRequest:
      type: object
      required:
        - model
        - input
      properties:
        model:
          type: string
          example: text-embedding-3-small
        input:
          description: |
            Teks yang akan di-embedding: satu string, array string, atau array
            token yang sudah dikodekan (satu array bilangan, atau array dari
            array bilangan untuk batch). Bentuk token diteruskan apa adanya ke
            provider berdialek OpenAI dan ditolak oleh provider dialek lain
            (mis. Google) yang hanya menerima teks.
          oneOf:
            - type: string
              example: Dokumen kebijakan privasi dan keamanan sistem.
            - type: array
              items:
                type: string
            - type: array
              items:
                type: integer
            - type: array
              items:
                type: array
                items:
                  type: integer

    EmbeddingResponse:
      type: object
      required:
        - object
        - data
        - model
        - usage
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                example: embedding
              index:
                type: integer
                example: 0
              embedding:
                type: array
                items:
                  type: number
        model:
          type: string
          example: text-embedding-3-small
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
              example: 8
            total_tokens:
              type: integer
              example: 8

    ModelObject:
      type: object
      properties:
        id:
          type: string
          example: gpt-4o
        object:
          type: string
          example: model
        created:
          type: integer
          example: 1700000000
        owned_by:
          type: string
          example: openai

    ModelListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelObject'
        first_id:
          type: string
          nullable: true
          description: Id entri pertama pada halaman ini (null bila kosong)
        last_id:
          type: string
          nullable: true
          description: Id entri terakhir pada halaman ini (null bila kosong)
        has_more:
          type: boolean
          description: Masih ada entri sesudah halaman ini

    UsageInfo:
      type: object
      required:
        - prompt_tokens
        - completion_tokens
        - total_tokens
      properties:
        prompt_tokens:
          type: integer
          example: 125
        completion_tokens:
          type: integer
          example: 450
        total_tokens:
          type: integer
          example: 575

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - message
            - type
            - code
          properties:
            message:
              type: string
              example: Kunci API tidak sah atau tidak ditemukan.
            type:
              type: string
              example: authentication_error
            code:
              type: string
              example: invalid_api_key
            param:
              type: string
              nullable: true
            request_id:
              type: string
              example: 3b15169b-ad67-43f1-87f7-5cbcfa88c759

  responses:
    400BadRequest:
      description: Masukan payload tidak valid atau melanggar aturan format
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    401Unauthorized:
      description: Autentikasi gagal atau kredensial tidak disertakan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    403Forbidden:
      description: Hak akses tidak mencukupi atau token CSRF ditolak
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    404NotFound:
      description: Entitas atau endpoint tidak ditemukan — pada /v1 termasuk model yang tidak dikenal (code model_not_found) atau dimatikan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    402BudgetExceeded:
      description: Anggaran biaya terlampaui (code budget_exceeded) — penolakan anggaran memakai 402, BUKAN 429
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    409Conflict:
      description: Konflik keunikan — sumber daya dengan nama/pengenal yang sama sudah ada (code conflict)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    429RateLimited:
      description: Batas kuota laju permintaan (RPM/TPM) terlampaui — anggaran biaya memakai 402, bukan status ini
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    502BadGateway:
      description: Seluruh upstream provider gagal atau sirkuit terbuka
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    503ServiceUnavailable:
      description: Tidak ada provider yang bisa melayani model saat ini (code no_provider_for_model / upstream_overloaded) atau dependensi internal tidak tersedia
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    504GatewayTimeout:
      description: Upstream tidak menjawab dalam batas waktu (code upstream_timeout)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
