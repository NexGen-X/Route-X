openapi: 3.1.0
info:
  title: Route-X AI Gateway API
  description: |
    Spesifikasi resmi antarmuka Route-X AI Gateway — gateway inferensi LLM berperforma tinggi dengan
    enkripsi kredensial AES-256-GCM, perutean adaptif ber-failover otomatis, pemutus arus terdistribusi,
    pengawasan anggaran berpresisi finansial (jumlah uang dinyatakan sebagai string desimal USD),
    jejak audit menyeluruh, dan dashboard operasional tersemat.

    Catatan cakupan: dokumen ini menguraikan SELURUH operasi yang terdaftar pada route tree
    aplikasi — permukaan /v1 (9 operasi, termasuk alias /v1/v1/messages dan count_tokens),
    /api/auth (5 operasi), kesehatan & telemetri (5 operasi), /api/internal (1 operasi), dan
    /api/admin (138 operasi) — total 158 operasi. Skema permintaan/respons admin diturunkan
    dari DTO handler aktual di internal/admin. Seluruh operasi /api/admin mensyaratkan sesi
    login konsol; mutasi (POST/PUT/DELETE) juga mensyaratkan header CSRF double-submit.
    Route-X memakai model admin tunggal: pengguna terautentikasi memegang izin penuh ("*");
    nama izin per operasi dicantumkan sebagai informasi granularitas akses internal.
  version: 1.6.1
  contact:
    name: Route-X Engineering Team
    email: admin@routex.internal
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: /
    description: Instance Gateway Lokal / Produksi

tags:
  - name: Inferencing
    description: Permukaan inferensi kompatibel OpenAI & Anthropic untuk klien (autentikasi kunci API)
  - name: Health & Telemetry
    description: Probe kesehatan, kesiapan, metrik Prometheus, dan pemeriksaan TLS untuk reverse proxy
  - name: Authentication
    description: Sesi login konsol administratif
  - name: Admin Observability
    description: Agregasi metrik pemakaian & kesehatan untuk dashboard
  - name: Admin Requests
    description: Log permintaan inferensi beserta peristiwa & payload-nya
  - name: Admin Upstreams
    description: Provider hulu, kredensial, OAuth, model kanonik, harga, dan pool egress
  - name: Admin Gateway
    description: Aturan perutean, batas laju, anggaran, ban, filter konten, circuit breaker
  - name: Admin Access
    description: Kunci API klien, pengguna konsol, dan sesi login
  - name: Admin Automation
    description: Webhook keluar dan riwayat pengirimannya
  - name: Admin System
    description: Pengaturan, domain, job latar, audit, cache respons, cadangan & pemulihan
  - name: Admin CLI
    description: Deteksi & konfigurasi perkakas CLI AI lokal

paths:
  # ============================================================================
  # 1. Inferencing Endpoints (/v1)
  # ============================================================================
  /v1/chat/completions:
    post:
      tags:
        - Inferencing
      summary: Eksekusi Chat Completions
      description: |
        Mengirimkan percakapan chat ke upstream provider model terbaik sesuai strategi perutean.
        Mendukung streaming respon SSE (Server-Sent Events), function/tool calling, pencatatan latensi TTFT,
        dan kalkulasi pemakaian token serta biaya moneter secara instan.
      operationId: createChatCompletion
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Berhasil memproses permintaan chat (atau stream text/event-stream)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
                description: Aliran SSE token teks per potongan
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '402':
          $ref: '#/components/responses/402BudgetExceeded'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429RateLimited'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'

  /v1/messages:
    post:
      tags:
        - Inferencing
      summary: Eksekusi Native Anthropic Messages API
      description: |
        Protokol asli Anthropic Claude Messages API (Claude Code, Cursor, Cline, LibreChat).
        Mendukung SSE streaming, multimodal images, tool/function calling.
        Prefiks ganda /v1/v1/messages juga dilayani sebagai alias toleransi untuk
        klien yang menyusun base URL berlapis; bentuk kanoniknya adalah /v1/messages.
        Pendamping POST /v1/messages/count_tokens menerima body yang sama dan
        mengembalikan taksiran jumlah token masukan.
      operationId: createAnthropicMessage
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: Berhasil memproses pesan Anthropic (atau stream text/event-stream)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessageResponse'
            text/event-stream:
              schema:
                type: string
                description: Aliran SSE Anthropic content_block_delta dan message_delta
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /v1/responses:
    post:
      tags:
        - Inferencing
      summary: Eksekusi Chat Completions (alias nama /responses)
      description: |
        Nama baru OpenAI untuk permukaan percakapan yang sama, dilayani handler
        Chat Completions. PERHATIAN: bentuk asli OpenAI Responses API
        (`{model, input}` dan respons ber-`object: response`) BELUM didukung —
        body wajib mengikuti skema Chat Completions (`messages`) dan responsnya
        berbentuk `chat.completion`. Klien yang mengirim bentuk Responses API
        asli menerima 400 karena `messages` kosong.
      operationId: createResponse
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Berhasil memproses permintaan (bentuk chat.completion)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '402':
          $ref: '#/components/responses/402BudgetExceeded'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429RateLimited'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'

  /v1/embeddings:
    post:
      tags:
        - Inferencing
      summary: Buat Representasi Vektor (Embeddings)
      description: Menghasilkan representasi vektor teks untuk pencarian semantik dan basis pengetahuan RAG.
      operationId: createEmbedding
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Vektor embeddings berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '402':
          $ref: '#/components/responses/402BudgetExceeded'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429RateLimited'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        '504':
          $ref: '#/components/responses/504GatewayTimeout'

  /v1/models:
    get:
      tags:
        - Inferencing
      summary: Daftar Model Tersedia
      description: |
        Mengembalikan katalog model kanonik dan alias yang aktif di Route-X Gateway.
        Hanya model yang benar-benar bisa dilayani key pemanggil yang tampil: model
        tanpa pemetaan provider, model yang dimatikan, dan model yang seluruh
        providernya terlarang bagi key tidak didaftarkan. Alias tampil sebagai entri
        sendiri. Endpoint ini bacaan katalog dan TIDAK memakan kuota laju inferensi.
      operationId: listModels
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Jumlah maksimum entri pada halaman ini. Tanpa parameter ini seluruh katalog dikembalikan.
          schema:
            type: integer
            minimum: 1
        - name: after_id
          in: query
          required: false
          description: Kursor paginasi — id entri terakhir dari halaman sebelumnya; halaman berikutnya mulai tepat sesudahnya.
          schema:
            type: string
      responses:
        '200':
          description: Daftar model berhasil dimuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /v1/models/{model}:
    get:
      tags:
        - Inferencing
      summary: Detail Satu Model
      description: |
        Mengembalikan satu entri model menurut nama kanonik atau aliasnya. Model
        yang tidak tampil di daftar (dimatikan, tanpa pemetaan, atau terlarang
        bagi key pemanggil) dijawab 404 yang sama seperti model yang tidak ada.
      operationId: getModel
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      parameters:
        - name: model
          in: path
          required: true
          description: Nama kanonik atau alias model
          schema:
            type: string
      responses:
        '200':
          description: Detail model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelObject'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/v1/messages:
    post:
      tags:
        - Inferencing
      summary: Eksekusi Native Anthropic Messages API (alias prefiks ganda)
      description: |
        Alias toleransi dari POST /v1/messages untuk klien yang menyusun base URL
        berlapis (mis. base URL berakhiran /v1, lalu SDK menambahkan /v1/messages).
        Handler, autentikasi, dan skema identik dengan bentuk kanoniknya.
      operationId: createAnthropicMessageAlias
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnthropicMessageRequest'
      responses:
        '200':
          description: Berhasil memproses pesan Anthropic (atau stream text/event-stream)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnthropicMessageResponse'
            text/event-stream:
              schema:
                type: string
                description: Aliran SSE Anthropic content_block_delta dan message_delta
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '502':
          $ref: '#/components/responses/502BadGateway'

  /v1/messages/count_tokens:
    post:
      tags:
        - Inferencing
      summary: Hitung Token Masukan Pesan Anthropic
      description: |
        Mengembalikan taksiran jumlah token masukan untuk body pesan Anthropic
        (model, messages, system, tools) TANPA menjalankan inferensi ke upstream.
        Taksiran dihitung lokal oleh estimator gateway, bukan lewat panggilan ke
        API penghitung token milik Anthropic, jadi nilainya aproksimasi. Model
        wajib dikenal katalog dan diizinkan bagi kunci pemanggil. Kesalahan
        dijawab dengan envelope error gaya Anthropic.
      operationId: countAnthropicMessageTokens
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountTokensRequest'
      responses:
        '200':
          description: Taksiran token masukan berhasil dihitung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountTokensResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /v1/v1/messages/count_tokens:
    post:
      tags:
        - Inferencing
      summary: Hitung Token Masukan Pesan Anthropic (alias prefiks ganda)
      description: |
        Alias toleransi dari POST /v1/messages/count_tokens untuk klien dengan
        base URL berlapis. Semantik identik dengan bentuk kanoniknya.
      operationId: countAnthropicMessageTokensAlias
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountTokensRequest'
      responses:
        '200':
          description: Taksiran token masukan berhasil dihitung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountTokensResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ============================================================================
  # 2. Health & Observability Endpoints
  # ============================================================================
  /healthz:
    get:
      tags:
        - Health & Telemetry
      summary: Liveness Probe
      description: |
        Memastikan biner gateway hidup dan dapat menerima lalu lintas HTTP. Respons
        sengaja hanya memuat status: endpoint ini publik tanpa autentikasi, jadi
        versi/commit/uptime tidak disajikan (informasi itu tersedia di log & endpoint admin).
      operationId: livenessProbe
      security: []
      responses:
        '200':
          description: Gateway dalam keadaan aktif
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
                    example: ok

    head:
      tags:
        - Health & Telemetry
      summary: Liveness Probe (HEAD)
      description: Bentuk HEAD dari liveness probe, untuk load balancer yang hanya memeriksa status.
      operationId: livenessProbeHead
      security: []
      responses:
        '200':
          description: Gateway dalam keadaan aktif

  /readyz:
    get:
      tags:
        - Health & Telemetry
      summary: Readiness Probe
      description: |
        Memeriksa kesiapan dependensi dan melaporkan status per dependensi pada field checks.
        Dependensi kritis (PostgreSQL) yang gagal membuat status down (HTTP 503); dependensi
        non-kritis (Redis — jalurnya fail-open untuk inferensi) yang gagal membuat status
        degraded tetapi tetap HTTP 200. Seperti /healthz, respons tidak memuat versi/commit
        maupun pesan error dependensi. Hasil pemeriksaan disimpan singkat (2 detik) agar
        probe beruntun tidak memperkuat beban ke dependensi.
      operationId: readinessProbe
      security: []
      responses:
        '200':
          description: Siap melayani permintaan (status ok, atau degraded bila hanya dependensi non-kritis yang gagal)
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                    example: ok
                  checks:
                    type: object
                    description: Status per dependensi menurut namanya (mis. postgres, redis)
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: [ok, degraded, down]
        '503':
          description: Dependensi kritis gagal — instance tidak siap melayani permintaan (status down)
          content:
            application/json:
              schema:
                type: object
                required: [status, checks]
                properties:
                  status:
                    type: string
                    enum: [down]
                  checks:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                          enum: [ok, degraded, down]
    head:
      tags:
        - Health & Telemetry
      summary: Readiness Probe (HEAD)
      description: Bentuk HEAD dari readiness probe.
      operationId: readinessProbeHead
      security: []
      responses:
        '200':
          description: Seluruh dependensi sehat dan siap melayani permintaan
        '503':
          description: Salah satu dependensi gagal atau terputus

  /metrics:
    get:
      tags:
        - Health & Telemetry
      summary: Prometheus Telemetry Metrics
      description: |
        Menyajikan eksposur metrik internal format teks Prometheus untuk scraping Prometheus/Grafana.
        Akses diberikan lewat salah satu dari: sesi admin, header
        `Authorization: Bearer <METRICS_TOKEN>`, atau koneksi loopback bila
        METRICS_ALLOW_LOOPBACK dinyalakan operator (bawaan mati di produksi).
      operationId: getPrometheusMetrics
      security:
        - SessionCookie: []
        - MetricsBearer: []
      responses:
        '200':
          description: Data metrik Prometheus
          content:
            text/plain:
              schema:
                type: string

  # ============================================================================
  # 3. Authentication & Session Management (/api/auth)
  # ============================================================================
  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Masuk Sesi Konsol Admin
      description: Memvalidasi kredensial email dan kata sandi menggunakan hashing Argon2id dan menetapkan cookie sesi.
      operationId: loginAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@routex.internal
                password:
                  type: string
                  format: password
                  example: GANTI_dengan_kata_sandi_anda
      responses:
        '200':
          description: Login berhasil, cookie routex_session dan routex_csrf terpasang
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '429':
          $ref: '#/components/responses/429RateLimited'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Keluar Sesi Konsol
      description: Menghapus token sesi dari database dan mencabut cookie sesi aktif.
      operationId: logoutAdmin
      security:
        - SessionCookie: []
          CSRFToken: []
      responses:
        '200':
          description: Sesi berhasil ditutup

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Informasi Pengguna & Hak Akses Sesi
      description: Mengambil data pengguna login saat ini beserta token CSRF sesi. Route-X memakai model dua tingkat tanpa RBAC (B-102) — admin penuh hanya untuk akun is_admin; pengguna biasa terautentikasi tanpa izin admin dan ditolak 403 di rute admin.
      operationId: getPrincipalMe
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Informasi identitas berhasil dimuat

  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Perbarui Kata Sandi Pengguna
      description: Mengubah kata sandi pengguna aktif dan mencabut sesi aktif lainnya.
      operationId: changePassword
      security:
        - SessionCookie: []
          CSRFToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Kata sandi berhasil diperbarui

  /api/auth/setup-hint:
    get:
      tags:
        - Authentication
      summary: Petunjuk Status Onboarding Awal
      description: |
        Endpoint publik yang menyatakan apakah instalasi masih pada keadaan
        awal (admin bawaan belum mengganti kata sandinya). Nonaktif secara
        informasi begitu onboarding selesai.
      operationId: getSetupHint
      security: []
      responses:
        '200':
          description: Status onboarding berhasil dimuat

  /api/internal/tls-check:
    get:
      tags:
        - Health & Telemetry
      summary: Pemeriksaan Domain & TLS untuk Caddy
      description: |
        Dipakai reverse proxy (Caddy on-demand TLS) untuk memutuskan apakah
        sebuah nama host boleh diterbitkan sertifikatnya. Menjawab 200 untuk
        domain yang terdaftar pada instalasi ini dan 400 untuk yang tidak.
      operationId: caddyTLSCheck
      security: []
      parameters:
        - name: domain
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Domain terdaftar; sertifikat boleh diterbitkan
        '400':
          description: Domain tidak terdaftar pada instalasi ini

  # ============================================================================
  # 4. Administrative REST API (/api/admin/*) — seluruh 138 operasi terdaftar
  # ============================================================================
  # --------------------------------------------------------------------------
  # Admin: Observability
  # --------------------------------------------------------------------------
  /api/admin/observability/summary:
    get:
      tags:
        - Admin Observability
      summary: "Ringkasan Metrik Operasional"
      description: |
        Izin internal yang disyaratkan: `usage:read`.
      operationId: getAdminSummary
      security:
        - SessionCookie: []
      parameters:
        - name: api_key_id
          in: query
          description: "Filter menurut ID kunci API"
          schema:
            type: string
        - name: provider_id
          in: query
          description: "Filter menurut ID provider"
          schema:
            type: string
        - name: model_id
          in: query
          description: "Filter menurut ID model"
          schema:
            type: string
        - name: source
          in: query
          description: "Sumber data agregasi"
          schema:
            type: string
        - name: granularity
          in: query
          description: "Granularitas titik deret waktu"
          schema:
            type: string
        - name: window
          in: query
          description: "Jendela waktu agregasi (mis. 1h, 24h, 7d, 30d)"
          schema:
            type: string
        - name: time_range
          in: query
          description: "Alias jendela waktu agregasi"
          schema:
            type: string
        - name: from
          in: query
          description: "Waktu mulai rentang (RFC 3339)"
          schema:
            type: string
        - name: to
          in: query
          description: "Waktu akhir rentang (RFC 3339)"
          schema:
            type: string
      responses:
        '200':
          description: Permintaan berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrafficStatsDTO"
        '401':
          $ref: "#/components/responses/401Unauthorized"
        '403':
          $ref: "#/components/responses/403Forbidden"
  /api/admin/observability/series:
    get:
      tags:
        - Admin Observability
      summary: "Deret Waktu Metrik Lalu Lintas"
      description: |
        Izin internal yang disyaratkan: `usage:read`.
      operationId: getSeries
      security:
        - SessionCookie: []
      parameters:
        - name: api_key_id
          in: query
          description: "Filter menurut ID kunci API"
          schema:
            type: string
        - name: provider_id
          in: query
          description: "Filter menurut ID provider"
          schema:
            type: string
        - name: model_id
          in: query
          description: "Filter menurut ID model"
          schema:
            type: string
        - name: source
          in: query
          description: "Sumber data agregasi"
          schema:
            type: string
        - name: granularity
          in: query
