  /api/admin/system/backup/status:
    get:
      tags:
        - Admin System
      summary: "Status Cadangan Database"
      description: |
        Mengembalikan ringkasan statistik ukuran database dan info berkas cadangan lokal.

        Izin internal yang disyaratkan: `settings:read`.
      operationId: getBackupStatus
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Permintaan berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatusDTO"
        '401':
          $ref: "#/components/responses/401Unauthorized"
        '403':
          $ref: "#/components/responses/403Forbidden"
  /api/admin/system/backup/export:
    post:
      tags:
        - Admin System
      summary: "Ekspor Cadangan Database (SQL)"
      description: |
        Mengalirkan dump SQL database terkompresi (.sql.gz) atau teks polos (.sql) langsung ke klien.

        Izin internal yang disyaratkan: `settings:write`.
      operationId: exportDatabaseSQL
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - name: format
          in: query
          description: "Format berkas cadangan: 'sql' atau 'sql.gz' (bawaan 'sql.gz')"
          schema:
            type: string
        - name: sslmode
          in: query
          description: "Parameter kueri sebagaimana dibaca handler"
          schema:
            type: string
      responses:
        '200':
          description: Berkas dump SQL database sebagai lampiran unduhan (Content-Disposition attachment)
          content:
            application/sql:
              schema:
                type: string
                format: binary
            application/gzip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
  /api/admin/system/backup/restore:
    post:
      tags:
        - Admin System
      summary: "Pulihkan Database dari Cadangan"
      description: |
        Memulihkan database dari berkas SQL yang diunggah (.sql atau .sql.gz).

        Izin internal yang disyaratkan: `settings:write`.
      operationId: restoreDatabaseSQL
      security:
        - SessionCookie: []
          CSRFToken: []
      parameters:
        - name: sslmode
          in: query
          description: "Parameter kueri sebagaimana dibaca handler"
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Berkas dump SQL cadangan hasil ekspor Route-X (.sql atau .sql.gz)
      responses:
        '200':
          description: Permintaan berhasil diproses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupRestoreResponse"
        '400':
          $ref: "#/components/responses/400BadRequest"
        '401':
          $ref: "#/components/responses/401Unauthorized"
        '403':
          $ref: "#/components/responses/403Forbidden"
