# ==============================================================================
# Route-X — Koyeb Deployment Specification
# Docs: https://www.koyeb.com/docs/reference/koyeb-yaml
# ==============================================================================
# Menjalankan Route-X di Koyeb Free Tier (Eco Instance 512MB RAM):
# Digabungkan dengan Neon.tech (PostgreSQL) dan Upstash (Redis).
# ==============================================================================

name: route-x
services:
  - name: route-x-gateway
    type: web
    docker:
      dockerfile: Dockerfile
    regions:
      - sin # Singapore (latensi rendah untuk Asia/Indonesia) atau fra (Frankfurt)
    instance_type: nano # Paket gratis Koyeb Eco (512MB RAM, 0.1 vCPU)
    ports:
      - port: 8080
        protocol: http
    routes:
      - path: /
        port: 8080
    health_checks:
      - http:
          port: 8080
          path: /healthz
        initial_delay: 30
        interval: 30
        timeout: 5
    env:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: LOG_LEVEL
        value: info
      - key: DB_MAX_CONNS
        value: "10"
      - key: DB_MIN_CONNS
        value: "2"
      - key: METRICS_ALLOW_LOOPBACK
        value: "false"
      - key: RATE_LIMIT_FAIL_CLOSED
        value: "false"
