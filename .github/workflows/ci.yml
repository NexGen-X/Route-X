name: ci

on:
  push:
    branches: [main]
  pull_request:

# Token GITHUB_TOKEN hanya butuh akses baca; tidak ada langkah yang menulis ke repo.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    # go test -race jauh lebih lambat dari biasanya; beri rampatan 20 menit.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: routex
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: routex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U routex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27.1"
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://routex:test_secret_pw@127.0.0.1:5432/routex_test?sslmode=disable
        run: go test -race ./... -count=1
      - name: Secret lint
        env:
          TEST_DATABASE_URL: postgres://routex:test_secret_pw@127.0.0.1:5432/routex_test?sslmode=disable
        run: go test -race ./internal/security/ -run TestSecretLeakLint -count=1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build
