services:
  gateway:
    # Port 8080 di-reset agar TIDAK dipublikasikan langsung ke host di lingkungan produksi.
    # Seluruh lalu lintas eksternal wajib melalui reverse proxy Caddy (port 80 & 443) demi penegakan TLS dan HSTS.
    ports: !reset []
    environment:
      - APP_ENV=production
      - DB_SSLMODE=require
      - PUBLIC_URL=${PUBLIC_URL:?PUBLIC_URL wajib disetel untuk produksi}

  caddy:
    image: caddy:2-alpine
    container_name: routex-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    networks:
      - routex_internal

volumes:
  caddy_data:
    name: routex_caddy_data
  caddy_config:
    name: routex_caddy_config
