# ==============================================================================
# Route-X — Fly.io Deployment Configuration
# Docs: https://fly.io/docs/reference/configuration/
# ==============================================================================

app = "route-x"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  METRICS_ALLOW_LOOPBACK = "false"
  RATE_LIMIT_FAIL_CLOSED = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
