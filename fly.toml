# ==============================================================================
# Route-X — Fly.io Deployment Configuration
# Docs: https://fly.io/docs/reference/configuration/
# ==============================================================================

app = "route-x"
primary_region = "sin" # Singapore (pilihan lain: hkg, nrt, syd, fra, iad)

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  PORT = "8080"
  LOG_LEVEL = "info"
  METRICS_ALLOW_LOOPBACK = "false"
  RATE_LIMIT_FAIL_CLOSED = "false"
  DB_MAX_CONNS = "15"
  DB_MIN_CONNS = "2"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 500

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
