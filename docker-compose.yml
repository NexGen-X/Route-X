# Batas log kontainer bersama: mencegah disk VPS kecil penuh oleh log json-file.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    container_name: routex-caddy
    restart: unless-stopped
    environment:
      # Caddyfile memakai {$DOMAIN:localhost}; tanpa env ini situs selalu
      # terikat localhost dan sertifikat TLS tidak pernah cocok dengan
      # domain publik operator.
      - DOMAIN=${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    logging: *default-logging
    networks:
      - routex-network

  routex:
    # VERSION diteruskan ke ARG VERSION Dockerfile agar biner Docker tercap
    # versi rilis, bukan selalu "dev" (audit3 V-DP-12). deploy.sh mengisinya
    # dari web/package.json (sumber versi tunggal repo); build manual boleh
    # menyetel env VERSION sendiri, dan tanpa itu cap "dev" adalah jujur.
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: routex-core
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - PORT=8080
      - PUBLIC_URL=${PUBLIC_URL:-https://${DOMAIN:-localhost}}
      - DATABASE_URL=postgres://routex:${POSTGRES_PASSWORD}@db:5432/routex_prod?sslmode=require
      - REDIS_URL=redis://redis:6379/0
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_KEY_PEPPER=${API_KEY_PEPPER}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@routex.local}
      # Kosong = seed TIDAK membuat admin (tidak ada password default).
      # deploy.sh mengisi nilai acak unik ke .env sebelum start pertama.
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-}
      # Client secret Antigravity diteruskan dari .env host (audit3
      # V-EO-24): tanpa baris ini env yang didokumentasikan di .env.example
      # tidak pernah sampai ke kontainer. Kosong = integrasi nonaktif.
      - ANTIGRAVITY_CLIENT_SECRET=${ANTIGRAVITY_CLIENT_SECRET:-}
      - METRICS_TOKEN=${METRICS_TOKEN}
      # Caddy adalah satu-satunya proxy di depan gateway pada topologi ini;
      # tanpa ini semua IP klien terbaca sebagai IP Caddy sehingga
      # rate-limit/ban per-IP dan access log tidak berguna. Subnet jaringan
      # compose ini TERPAKU (lihat networks di bawah) supaya bawaannya
      # persis seluas jaringan itu — bukan lagi seluruh rentang privat
      # 172.16.0.0/12 (audit3 B-047).
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-172.30.0.0/16}
      # PERINGATAN: daftar ini mengizinkan upstream/egress ke alamat privat
      # (provider lokal seperti Ollama di host yang sama adalah kasus pakai
      # yang sah untuk instalasi pribadi). Perketat lewat env
      # UPSTREAM_ALLOWED_PRIVATE_ADDRS bila tidak memakai provider lokal.
      - UPSTREAM_ALLOWED_PRIVATE_ADDRS=${UPSTREAM_ALLOWED_PRIVATE_ADDRS:-127.0.0.1,::1,127.0.0.0/8}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks:
      - routex-network

  db:
    image: postgres:16-alpine
    container_name: routex-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=routex
      # :? menggagalkan compose dengan pesan jelas bila belum disetel di .env,
      # alih-alih diam-diam memakai kata sandi bawaan (audit3 V-LN-39).
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?SETEL_POSTGRES_PASSWORD_DI_ENV}
      - POSTGRES_DB=routex_prod
    volumes:
      - routex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routex -d routex_prod"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    networks:
      - routex-network

  redis:
    image: redis:7-alpine
    container_name: routex-redis
    restart: unless-stopped
    volumes:
      - routex_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    networks:
      - routex-network

volumes:
  caddy_data:
  caddy_config:
  routex_pgdata:
  routex_redisdata:

networks:
  routex-network:
    driver: bridge
    # Subnet TERPAKU (audit3 B-047): tanpa ini Docker memilih subnet
    # privat bergiliran antar instalasi, dan bawaan TRUSTED_PROXIES tidak
    # bisa menunjuk jaringan ini secara tepat.
    ipam:
      config:
        - subnet: 172.30.0.0/16
