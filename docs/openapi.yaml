        alerted_at:
          type: string
          format: date-time
          nullable: true
        exceeded_alerted_at:
          type: string
          format: date-time
          nullable: true
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, name, scope, scope_id, period, limit_usd, max_spend_usd, spent_usd, period_start, action_on_exceed, action, alert_threshold_pct, alert_threshold, enabled, created_at, updated_at]
    BudgetListEnvelope:
