# ==============================================================================
# Route-X — Production Nginx Server Block
# ==============================================================================

upstream routex_backend {
    server 127.0.0.1:8080;
    keepalive 64;
}

server {
    listen 80;
    server_name gateway.example.com;

    # Alihkan seluruh permintaan HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gateway.example.com;

    # Sertifikat SSL / TLS
    ssl_certificate     /etc/letsencrypt/live/gateway.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Batas ukuran payload request (sesuaikan dengan MAX_REQUEST_MIB gateway)
    client_max_body_size 64M;

    # Header Keamanan
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://routex_backend;
        proxy_http_version 1.1;

        # Header penerusan identitas jaringan
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Konfigurasi KRITIS untuk SSE (Server-Sent Events) & Streaming LLM:
        # Menghapus buffering agar token teks keluar seketika (low TTFT).
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Dukungan upgrade koneksi
        proxy_set_header Connection "";
    }
}
