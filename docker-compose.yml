services:
  caddy:
    image: caddy:2-alpine
    container_name: routex-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - routex-network

  routex:
    build: .
    container_name: routex-core
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - PORT=8080
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8080}
      - DATABASE_URL=postgres://routex:${POSTGRES_PASSWORD}@db:5432/routex_prod?sslmode=prefer
      - REDIS_URL=redis://redis:6379/0
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_KEY_PEPPER=${API_KEY_PEPPER}
      - INITIAL_ADMIN_EMAIL=${INITIAL_ADMIN_EMAIL:-admin@example.com}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD}
      - METRICS_TOKEN=${METRICS_TOKEN}
      - TRUSTED_PROXIES=0.0.0.0/0
      - UPSTREAM_ALLOWED_PRIVATE_ADDRS=xray,127.0.0.1,::1,127.0.0.0/8,172.16.0.0/12
    volumes:
      - ./deploy/xray:/opt/routex/deploy/xray
    depends_on:
      - db
      - redis
      - xray
    networks:
      - routex-network

  db:
    image: postgres:16-alpine
    container_name: routex-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=routex
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=routex_prod
    volumes:
      - routex_pgdata:/var/lib/postgresql/data
    networks:
      - routex-network

  redis:
    image: redis:7-alpine
    container_name: routex-redis
    restart: unless-stopped
    volumes:
      - routex_redisdata:/data
    networks:
      - routex-network

  xray:
    image: teddysun/xray:latest
    container_name: routex-xray
    restart: unless-stopped
    volumes:
      - ./deploy/xray:/etc/xray
    networks:
      - routex-network

volumes:
  caddy_data:
  caddy_config:
  routex_pgdata:
  routex_redisdata:

networks:
  routex-network:
    driver: bridge
