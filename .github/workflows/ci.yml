name: ci

on:
  push:
    branches: [main]
  pull_request:

# Token GITHUB_TOKEN hanya butuh akses baca; tidak ada langkah yang menulis ke repo.
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    # go test -race jauh lebih lambat dari biasanya; beri rampatan 20 menit.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: routex
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: routex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U routex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          check-latest: true
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      # AUDIT FIX: pemindaian kerentanan dependensi Go terhadap Go vulnerability
      # database. Tidak ada CVE yang dikenali pada audit awal, namun CI belum pernah
      # menegakkannya; langkah ini mencegah regresi diam-diam (tidak mengubah go.mod).
      - name: Govulncheck
        run: |
          # Versi di-pin (audit F10): @latest membuat hasil CI tidak
          # reprodusibel dan bisa berubah perilaku tanpa perubahan repo.
          # v1.9.0 = versi terbaru yang terbukti lolos di repo ini;
          # versi lama (v1.1.4) PANIK saat menganalisis kode Go 1.27
          # karena x/tools bawaannya belum mengenal konstruksinya.
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Vet
        run: go vet ./...
      - name: Dead code (deadcode)
        # Gerbang anti dead code (Fase 3 P2): mode -test supaya fungsi yang
        # dipakai test sebagai jahitan (seam) tidak dituduh mati. Satu-satunya
        # pengecualian sah: metode String/GoString/LogValue pada tipe pemuat
        # rahasia — keberadaannya DIWAJIBKAN lint keamanan AST
        # TestRedaksiFieldTakDiekspor (internal/security), yang tidak terlihat
        # oleh analisis keterjangkauan deadcode.
        run: |
          go run golang.org/x/tools/cmd/deadcode@v0.52.0 -test ./... > /tmp/deadcode.txt
          sisa=$(grep -vE "unreachable func: (Handlers|Service|DB)\.(String|GoString|LogValue)$" /tmp/deadcode.txt || true)
          if [ -n "$sisa" ]; then echo "$sisa"; echo "::error::deadcode menemukan fungsi tak terjangkau baru"; exit 1; fi
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://routex:test_secret_pw@127.0.0.1:5432/routex_test?sslmode=disable
        run: go test -race -timeout=20m ./... -count=1
      - name: Secret lint
        env:
          TEST_DATABASE_URL: postgres://routex:test_secret_pw@127.0.0.1:5432/routex_test?sslmode=disable
        run: go test -race ./internal/security/ -run TestSecretLeakLint -count=1
      - name: Fuzz SSE Parser
        run: go test -fuzz=FuzzSSEReader -fuzztime=30s ./internal/providers/

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run test
      - name: Dead code (knip)
        run: npm run check:deadcode
      - run: npm run build


  # Job build Docker (audit F10): Dockerfile adalah jalur deploy utama,
  # tetapi sebelum ini tidak pernah dibangun CI — kerusakan Dockerfile
  # baru ketahuan saat operator men-deploy manual. Build saja, tanpa push.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image
        run: docker build -t routex:ci .
